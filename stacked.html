<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacked Cards</title>
  <link rel="stylesheet" href="css/stacked.css"></link>
  <script src="script.js" defer></script>
</head>
<body>
  <section class="stacked-cards">
  <div class="main-div">

    <div class="card-div card1" data-index="1">
      <img class="card-img" src="assets/images/card1.webp">
      <h3 class="card-heading">New York</h3>
      <p class="para">This is New York City, New York, United States of America.</p>
    </div>

    <div class="card-div card2" data-index="2">
      <img class="card-img" src="assets/images/card2.jpg">
      <h3 class="card-heading">London</h3>
      <p class="para">This is London, the capital of The United Kingdom.</p>
    </div>

    <div class="card-div card3" data-index="3">
      <img class="card-img" src="assets/images/card3.jpg">
      <h3 class="card-heading">Edinburgh</h3>
      <p class="para">This is Edinburgh, Scotland.</p>
    </div>

    <div class="card-div card4" data-index="4">
      <img class="card-img" src="assets/images/card4.jpg">
      <h3 class="card-heading">Sydney</h3>
      <p class="para">This is Sydney, the largest city in the continent of Australia.</p>
    </div>
  </div>
</section>
  <a href="pricing.html"><button>Click to go to next section</button></a>

</body>
</html>
